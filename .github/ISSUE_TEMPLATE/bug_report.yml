name: Reportar un error
description: Informa un problema reproducible en Mony.
title: "[Error]: "
body:
  - type: markdown
    attributes:
      value: |
        Antes de reportar, busca entre los issues abiertos y cerrados. Si el problema ya existe, agrega la información útil en ese issue en lugar de crear uno nuevo.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Verificación de duplicados
      options:
        - label: Busqué entre los issues abiertos y cerrados y no encontré este mismo problema.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: ¿Qué ocurrió?
      description: Describe brevemente el problema y qué estabas intentando hacer.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Describe los pasos exactos y mínimos que hacen aparecer el problema.
      placeholder: |
        1. Abrir...
        2. Pulsar...
        3. Observar...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
      description: Explica qué debería ocurrir.

  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Si lo conoces, indica la versión de Mony, Android y el dispositivo utilizado.
      placeholder: "Ejemplo: Mony 1.2.3, Android 15, Pixel 8"

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia adicional
      description: Agrega capturas, grabaciones o mensajes relevantes. No incluyas datos financieros, respaldos, credenciales ni información personal.
