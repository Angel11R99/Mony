name: Compartir una idea
description: Propón una idea para Mony, como hacer la interfaz más intuitiva, en un par de clics.
title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: |
        Este espacio es para ideas en cualquier etapa, incluso si no están pulidas. No necesitas saber cómo se implementaría: con marcar opciones basta. Antes de escribir, revisa los issues abiertos y cerrados.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Verificación
      options:
        - label: Busqué entre los issues abiertos y cerrados y no encontré una idea equivalente.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: ¿Dónde aplicaría?
      options:
        - Inicio
        - Registrar gastos o ingresos
        - Historial
        - Estadísticas
        - Entradas fijas
        - Entradas pendientes
        - Límites de categoría
        - Ajustes
        - Widgets
        - En toda la app
    validations:
      required: true

  - type: checkboxes
    id: direction
    attributes:
      label: ¿Qué dirección toma tu idea? (marca todo lo que aplica)
      options:
        - Hacerlo más intuitivo
        - Información más clara
        - Menos pasos para hacer algo
        - Mejor apariencia
        - Personalización
        - Accesibilidad
        - Otra

  - type: input
    id: summary
    attributes:
      label: Resumen de tu idea (una línea, opcional)
      placeholder: "Ejemplo: que el saldo del mes se vea de un vistazo"

  - type: textarea
    id: details
    attributes:
      label: Cuéntala con más detalle (opcional)
      description: Agrega ejemplos, bocetos o referencias de otras apps si quieres.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        No incluyas datos financieros, respaldos, credenciales ni información personal.