name: Reportar pérdida o problemas con los datos
description: Movimientos que desaparecen, se duplican o se corrompen, o problemas tras actualizar la app.
title: "[Datos]: "
body:
  - type: markdown
    attributes:
      value: |
        Este canal es para problemas graves con la información guardada. Marca opciones y agrega texto solo si quieres. Antes de reportar, revisa los issues abiertos y cerrados.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Verificación
      options:
        - label: Busqué entre los issues abiertos y cerrados y no encontré un reporte equivalente.
          required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: Tipo de problema
      options:
        - Movimientos que desaparecen
        - Movimientos duplicados
        - Montos o categorías que cambian solos
        - Problema después de actualizar la app
        - La app no abre tras actualizar
        - Presupuesto o límites perdidos
        - Otro
    validations:
      required: true

  - type: checkboxes
    id: affected
    attributes:
      label: ¿Qué datos se vieron afectados? (marca todo lo que aplica)
      options:
        - Gastos
        - Ingresos
        - Presupuesto / ciclo
        - Límites de categoría
        - Entradas fijas
        - Entradas pendientes
        - Metas de ahorro
        - Textos o ajustes
        - Todo

  - type: dropdown
    id: timing
    attributes:
      label: ¿Cuándo empezó?
      options:
        - Tras actualizar Mony
        - Tras cerrar el ciclo
        - Tras reinstalar la app
        - De un momento a otro, sin cambio claro
        - No lo sé
    validations:
      required: true

  - type: input
    id: what_happened
    attributes:
      label: ¿Qué pasó? (en una línea, opcional)
      placeholder: "Ejemplo: después de actualizar, me faltan los gastos de la semana pasada"

  - type: textarea
    id: details
    attributes:
      label: Detalle (opcional)
      description: Qué estabas haciendo justo antes, versión anterior y actual si la conoces, y cualquier detalle útil.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        IMPORTANTE: NO publiques respaldos de la base de datos, datos financieros, credenciales ni información personal. Las capturas o mensajes útiles sí pueden adjuntarse.