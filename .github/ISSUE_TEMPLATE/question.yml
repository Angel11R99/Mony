name: Hacer una pregunta
description: Duda sobre cómo funciona Mony, qué significa algo o qué hacer en una situación.
title: "[Pregunta]: "
body:
  - type: markdown
    attributes:
      value: |
        Revisa los issues abiertos y cerrados por si tu duda ya fue respondida. Solo necesitas la sección y una línea; el detalle es opcional.

  - type: dropdown
    id: area
    attributes:
      label: ¿Sobre qué sección?
      options:
        - Inicio
        - Registrar gastos o ingresos
        - Historial
        - Estadísticas
        - Entradas fijas
        - Entradas pendientes
        - Límites de categoría
        - Ciclo y presupuesto
        - Ajustes
        - Widgets
        - Otro
    validations:
      required: true

  - type: input
    id: question
    attributes:
      label: Tu pregunta (una línea)
      placeholder: "Ejemplo: ¿los gastos fijos se descuentan del presupuesto del mes?"
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Más contexto (opcional)
      description: Explica qué intentaste hacer o el momento en que te surgió la duda.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Versión de Mony y Android (si lo conoces, opcional)
      placeholder: "Ejemplo: Mony 1.2.3, Android 15"