name: Reportar un problema de rendimiento
description: La app o los widgets tardan, se traban o consumen demasiado.
title: "[Rendimiento]: "
body:
  - type: markdown
    attributes:
      value: |
        Antes de reportar, revisa los issues abiertos y cerrados. Marca opciones y agrega texto solo si quieres.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Verificación
      options:
        - label: Busqué entre los issues abiertos y cerrados y no encontré un reporte equivalente.
          required: true

  - type: dropdown
    id: where
    attributes:
      label: ¿Dónde ocurre?
      options:
        - Al abrir la app
        - Al registrar un movimiento
        - Al moverse entre secciones
        - En el historial
        - En estadísticas
        - En widgets
        - En general
    validations:
      required: true

  - type: checkboxes
    id: symptoms
    attributes:
      label: ¿Qué notas? (marca todo lo que aplica)
      options:
        - Tarda en abrir o cargar
        - Se congela
        - La lista se mueve mal
        - Los widgets tardan en actualizar
        - Consume mucha batería
        - Se calienta
        - Otra cosa

  - type: dropdown
    id: volume
    attributes:
      label: ¿Cuántos movimientos tienes aproximadamente?
      options:
        - Menos de 500
        - Entre 500 y 2.000
        - Entre 2.000 y 5.000
        - Más de 5.000
        - No lo sé
    validations:
      required: true

  - type: checkboxes
    id: frequency
    attributes:
      label: ¿Cuándo ocurre?
      options:
        - Siempre
        - A veces
        - Solo una vez

  - type: input
    id: device
    attributes:
      label: Dispositivo (si lo conoces, opcional)
      placeholder: "Ejemplo: Moto G54, Android 13, Mony 1.2.3"

  - type: textarea
    id: details
    attributes:
      label: Detalle (opcional)
      description: Pasos exactos o cualquier contexto que ayude a reproducirlo.
      placeholder: |
        1. Abrir Mony...
        2. Ir a historial...
        3. ...
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Puedes adjuntar grabaciones de pantalla. No incluyas datos financieros, respaldos, credenciales ni información personal.