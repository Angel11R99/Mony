name: Reportar un problema de rendimiento
description: La app o los widgets tardan, se traban o consumen demasiado.
title: "[Rendimiento]: "
body:
  - type: markdown
    attributes:
      value: |
        Usa esta plantilla cuando Mony tarde en abrir, se congele, desplace mal la lista de movimientos, o cuando los widgets tarden o consuman mucha batería. Antes de reportar, revisa los issues abiertos y cerrados.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Verificación de duplicados
      options:
        - label: Busqué entre los issues abiertos y cerrados y no encontré un reporte equivalente.
          required: true

  - type: dropdown
    id: where
    attributes:
      label: ¿Dónde ocurre?
      options:
        - Al abrir la app
        - Al registrar un movimiento
        - Al moverse entre secciones
        - Al revisar el historial
        - En estadísticas
        - En widgets
        - En general
    validations:
      required: true

  - type: textarea
    id: what_happens
    attributes:
      label: ¿Qué comportamiento notas?
      description: Describe qué se siente lento: la app se congela, tarda en cargar, la lista se mueve mal, etc.
    validations:
      required: true

  - type: textarea
    id: scale
    attributes:
      label: Volumen de datos
      description: Indica aproximadamente cuántos movimientos registrados tienes y hace cuánto empezaste a usar la app. Esto ayuda a reproducir el problema.
      placeholder: |
        Ejemplo: "Alrededor de 1.500 movimientos en 8 meses, una entrada fija y una pendiente."

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Describe la secuencia exacta con la que aparece el problema.
      placeholder: |
        1. Abrir Mony...
        2. Ir a historial...
        3. Desplazarse...
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Dispositivo
      description: Modelo del dispositivo, versión de Android y de Mony, si lo conoces.
      placeholder: "Ejemplo: Moto G54, Android 13, Mony 1.2.3"

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia adicional
      description: Agrega grabaciones de pantalla si ayudan. No incluyas datos financieros, respaldos, credenciales ni información personal.