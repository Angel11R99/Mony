name: Reportar un error en cálculos o cifras
description: Totales, presupuesto, estadísticas o límites que no cuadran con lo esperado.
title: "[Cálculos]: "
body:
  - type: markdown
    attributes:
      value: |
        Antes de reportar, revisa los issues abiertos y cerrados. Marca la zona y las cifras: no hace falta describir todo.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Verificación
      options:
        - label: Busqué entre los issues abiertos y cerrados y no encontré un reporte equivalente.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Presupuesto del ciclo
        - Ingresos y gastos
        - Estadísticas
        - Límites por categoría
        - Entradas fijas
        - Entradas pendientes
        - Metas de ahorro
        - Widgets
        - Otro
    validations:
      required: true

  - type: checkboxes
    id: symptoms
    attributes:
      label: ¿Qué sale mal? (marca todo lo que aplica)
      options:
        - label: Disponible / restante mal calculado
        - label: Total de gastos mal
        - label: Total de ingresos mal
        - label: Porcentajes mal
        - label: Límite de categoría mal
        - label: Promedios (diario/mensual) mal
        - label: Fechas mal (ciclo, inicios)
        - label: Otra cifra

  - type: input
    id: expected
    attributes:
      label: Cifra esperada (opcional)
      placeholder: "Ejemplo: RD$ 1.500,00"

  - type: input
    id: actual
    attributes:
      label: Cifra mostrada (opcional)
      placeholder: "Ejemplo: RD$ 1.650,00"

  - type: textarea
    id: context
    attributes:
      label: Contexto (opcional)
      description: Montos, fechas o movimientos que usaste para calcular lo esperado.
      placeholder: "Ejemplo: gasté RD$ 500 en transporte el día 3 y RD$ 1.000 en comida."
    validations:
      required: false

  - type: dropdown
    id: reproduce
    attributes:
      label: ¿Cuándo ocurre?
      options:
        - Siempre
        - A veces
        - Solo una vez

  - type: input
    id: version
    attributes:
      label: Versión de Mony y Android (opcional)
      placeholder: "Ejemplo: Mony 1.2.3, Android 15"

  - type: markdown
    attributes:
      value: |
        Puedes adjuntar capturas. No incluyas datos financieros, respaldos, credenciales ni información personal.