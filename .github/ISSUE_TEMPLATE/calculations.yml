name: Reportar un error en cálculos o cifras
description: Totales, presupuesto, estadísticas o límites que no cuadran con lo esperado.
title: "[Cálculos]: "
body:
  - type: markdown
    attributes:
      value: |
        Usa esta plantilla cuando una cifra no cuadre: presupuesto del ciclo, lo que queda disponible, estadísticas, límites por categoría, ahorros o historial. Es importante diferenciar el dato esperado del dato mostrado. Antes de reportar, revisa los issues abiertos y cerrados.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Verificación de duplicados
      options:
        - label: Busqué entre los issues abiertos y cerrados y no encontré un reporte equivalente.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Presupuesto del ciclo
        - Ingresos y gastos
        - Estadísticas
        - Límites por categoría
        - Entradas fijas
        - Entradas pendientes
        - Metas de ahorro
        - Widgets
        - Otro
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ¿Qué cifra esperabas?
      description: Explica el cálculo que esperabas ver y sobre qué datos se basa (fechas, montos, categorías en cuestión).
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ¿Qué cifra muestra Mony?
      description: Indica el número o resultado diferente que muestra la app.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Describe los pasos para llegar al resultado, incluyendo qué movimientos se registraron primero.
      placeholder: |
        1. Registrar ingreso de RD$ ... el día ... de la categoría ...
        2. Registrar gasto de RD$ ...
        3. Revisar ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de Mony y Android
      description: Si lo conoces, indica la versión de Mony y de Android.
      placeholder: "Ejemplo: Mony 1.2.3, Android 15"

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia adicional
      description: Agrega capturas de los movimientos y de la cifra incorrecta. No incluyas datos financieros, respaldos, credenciales ni información personal.