name: Proponer una mejora
description: Sugiere una mejora o función para Mony antes de implementarla.
title: "[Mejora]: "
body:
  - type: markdown
    attributes:
      value: |
        Antes de proponer una mejora, revisa los issues abiertos y cerrados. Lo más útil es un resumen corto; el detalle es opcional.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Verificación
      options:
        - label: Busqué entre los issues abiertos y cerrados y no encontré una propuesta equivalente.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Sección
      options:
        - Inicio
        - Registrar gastos o ingresos
        - Historial
        - Estadísticas
        - Entradas fijas
        - Entradas pendientes
        - Límites de categoría
        - Ajustes
        - Widgets
        - Global / otra
    validations:
      required: true

  - type: checkboxes
    id: what_for
    attributes:
      label: ¿Qué te ayudaría a lograr? (marca todo lo que aplica)
      options:
        - Que sea más rápido de usar
        - Que la información sea más clara
        - Que algo nuevo sea posible
        - Evitar errores al registrar
        - Mejor aspecto visual
        - Mejor accesibilidad

  - type: input
    id: summary
    attributes:
      label: Resumen de la mejora (una línea)
      placeholder: "Ejemplo: poder repetir un gasto mensual que ya registré"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Detalle (opcional)
      description: Describe cómo esperas que funcione y qué alternativas consideraste, solo si quieres.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Puedes adjuntar bocetos o capturas. No incluyas datos financieros, respaldos, credenciales ni información personal.