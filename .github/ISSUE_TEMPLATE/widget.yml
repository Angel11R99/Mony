name: Reportar un problema o idea de widgets
description: Fallos, dudas o ideas sobre los widgets de Mony.
title: "[Widget]: "
body:
  - type: markdown
    attributes:
      value: |
        Antes de reportar, revisa los issues abiertos y cerrados. Marca opciones y agrega texto solo si quieres.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Verificación
      options:
        - label: Busqué entre los issues abiertos y cerrados y no encontré un reporte equivalente.
          required: true

  - type: dropdown
    id: widget_kind
    attributes:
      label: Tipo
      options:
        - Error o datos incorrectos
        - No se actualiza
        - Idea o rediseño
        - Apariencia o tema
        - Pregunta
    validations:
      required: true

  - type: checkboxes
    id: widget_name
    attributes:
      label: ¿Qué widget? (marca todos los que apliquen)
      options:
        - Progreso del presupuesto
        - Límites por categoría
        - Gasto diario
        - Ingresos y gastos
        - Acceso rápido
        - Movimientos recientes
        - Compromisos fijos
        - Recordatorios pendientes
        - Metas de ahorro
        - Estadísticas
        - No sé / otro

  - type: checkboxes
    id: symptoms
    attributes:
      label: ¿Qué notas? (marca todo lo que aplica)
      options:
        - Muestra datos viejos
        - Un monto sale mal
        - No responde al tocarlo
        - Se ve cortado o feo
        - Tarda mucho en actualizar
        - Otra cosa

  - type: input
    id: one_liner
    attributes:
      label: ¿Qué pasaba? (en una línea, opcional)
      placeholder: "Ejemplo: registré un gasto y el widget sigue con el total de ayer"

  - type: textarea
    id: details
    attributes:
      label: Detalle (opcional)
      description: Pasos para reproducirlo o descripción de tu idea.
      placeholder: |
        1. Agregar el widget...
        2. Registrar...
        3. ...
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Dispositivo y lanzador (si lo conoces, opcional)
      placeholder: "Ejemplo: Pixel 8, lanzador de stock"

  - type: markdown
    attributes:
      value: |
        Puedes adjuntar capturas del widget. No incluyas datos financieros, respaldos, credenciales ni información personal.