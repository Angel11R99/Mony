name: Limpiar releases antiguos y publicar versión sin IA
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-time-hide-ai-release-cleanup.yml
permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  cleanup-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar exclusivamente releases anteriores a 2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GH_REPO" != "Angel11R99/Mony" ]]; then
            echo "Repositorio inesperado, no se modifica ningún release"
            exit 1
          fi
          # Release objects ONLY. Git tags and source history are left intact.
          for tag in v1.0.2 v1.0.3 v1.0.4 v1.0.5 v1.0.6 v1.0.7; do
            id=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.id' 2>/dev/null || true)
            if [[ -z "$id" || ! "$id" =~ ^[0-9]+$ ]]; then
              echo "No existe el release $tag; omitido"
              continue
            fi
            echo "Eliminando release $tag (ID $id)"
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
          done
          echo "Releases de 2.0.0 en adelante conservados"
      - name: Solicitar APK firmada de Mony sin IA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref master -f version_bump=patch
      - name: Eliminar rama del PR fusionado
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const {data:prs}=await github.rest.pulls.list({owner,repo,state:'closed',per_page:100});
            const pr=prs.find(p=>p.head.ref==='chore/hide-experimental-ai-and-prune-pre-v2-releases' && p.merged_at);
            if(!pr) return;
            const {data:open}=await github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+pr.head.ref});
            if(open.length!==0) return;
            try {
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+pr.head.ref});
              core.info('Rama fusionada eliminada');
            }catch(e){if(e.status!==404) throw e;}
