name: Validar issue vinculada

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: validate-linked-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-linked-issue:
    name: Issue vinculada
    runs-on: ubuntu-latest
    steps:
      - name: Verificar issue previa y PR duplicadas
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullRequest = context.payload.pull_request;
            const closingPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;

            function linkedIssues(body) {
              return [...(body || '').matchAll(closingPattern)]
                .map((match) => Number(match[1]))
                .filter((number, index, numbers) => number > 0 && numbers.indexOf(number) === index);
            }

            const issueNumbers = linkedIssues(pullRequest.body);
            if (issueNumbers.length === 0) {
              core.setFailed('La PR debe incluir al menos una referencia como "Closes #123" a un issue abierto y previo.');
              return;
            }

            const errors = [];
            for (const issueNumber of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                });

                if (issue.pull_request) {
                  errors.push(`#${issueNumber} es una pull request, no un issue.`);
                } else if (issue.state !== 'open') {
                  errors.push(`#${issueNumber} no está abierto.`);
                } else if (new Date(issue.created_at) >= new Date(pullRequest.created_at)) {
                  errors.push(`#${issueNumber} debe haberse creado antes que esta PR.`);
                }
              } catch (error) {
                if (error.status === 404) {
                  errors.push(`#${issueNumber} no existe en este repositorio o no es accesible.`);
                } else {
                  throw error;
                }
              }
            }

            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const otherPullRequest of openPullRequests) {
              if (otherPullRequest.number === pullRequest.number) continue;

              const duplicatedIssues = linkedIssues(otherPullRequest.body)
                .filter((number) => issueNumbers.includes(number));

              if (duplicatedIssues.length > 0) {
                errors.push(
                  `La PR #${otherPullRequest.number} ya está vinculada a ${duplicatedIssues.map((number) => `#${number}`).join(', ')}: ${otherPullRequest.html_url}`,
                );
              }
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
              return;
            }

            core.info(`Validación correcta para ${issueNumbers.map((number) => `#${number}`).join(', ')}.`);
