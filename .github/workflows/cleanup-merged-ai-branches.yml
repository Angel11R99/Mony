name: Limpiar ramas de PR fusionados

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cleanup-merged-ai-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar solo las ramas ya cerradas
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (const branch of [
              'feature/google-gemini-nano-voice-only',
              'feature/voice-ai-model-catalog-release',
            ]) {
              const { data: openPRs } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: owner + ':' + branch,
              });
              if (openPRs.length > 0) {
                core.warning('No se elimina ' + branch + ': tiene PR abierto');
                continue;
              }
              const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'closed' });
              const belongsToMergedPR = prs.some(pr => pr.head.ref === branch && pr.merged_at);
              if (!belongsToMergedPR) {
                core.warning('No se elimina ' + branch + ': sin merge confirmado');
                continue;
              }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch });
                core.info('Rama eliminada: ' + branch);
              } catch (e) {
                if (e.status === 404 || e.status === 422) {
                  core.warning('Rama ya no existente/protegida: ' + branch);
                } else {
                  throw e;
                }
              }
            }
