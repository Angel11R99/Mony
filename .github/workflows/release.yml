name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Crear release
    runs-on: ubuntu-latest
    steps:
      - name: Revisar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore desde secret
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Preparar y compilar release
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew buildNextRelease

      - name: Obtener versión preparada
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          if [[ -z "$VERSION_NAME" ]]; then
            echo "No se pudo leer VERSION_NAME de version.properties." >&2
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Confirmar cambios de versión y README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties README.md
          git diff --cached --quiet || git commit -m "Chore: Preparar release v${{ steps.version.outputs.version }}"

      - name: Usar deploy key para publicar en master
        shell: bash
        run: git remote set-url origin git@github.com:Angel11R99/Mony.git

      - name: Publicar cambios en master
        shell: bash
        run: git push origin master

      - name: Crear y publicar tag
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Crear release en GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK="app/build/outputs/apk/release/Mony-v$VERSION-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "No se encontró el APK esperado: $APK" >&2
            exit 1
          fi
          gh release create "v$VERSION" "$APK" --title "Mony v$VERSION" --generate-notes